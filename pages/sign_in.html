<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sign in · Rota.Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body class="rota-auth-bg">
  <main class="auth-shell">
    <div class="auth-brand">
      <img src="/assets/rota-website-logo.png" alt="Rota.Website" />
    </div>

    <div class="auth-card">
      <p class="auth-eyebrow">Sign in</p>
      <h1>Welcome back</h1>
      <p class="auth-sub">Enter your email address to continue to your rota.</p>

      <!-- Kinde injects the active form here -->
      <div id="kinde-widget"></div>

      <div class="auth-foot">
        New to Rota.Website? <a href="https://rota.website/signup">Create an account</a>
      </div>
    </div>

    <p class="auth-trust">Biometric &amp; 2FA ready · UK data · Secured by Kinde</p>
  </main>

  <script src="https://cdn.kinde.com/widget/v1/kinde-widget.js"></script>
</body>
</html>
