<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Password · Rota.Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body class="rota-auth-bg">
  <main class="auth-shell">
    <div class="auth-brand">
      <img src="/assets/rota-website-logo.png" alt="Rota.Website" />
    </div>

    <div class="auth-card">
      <p id="password-eyebrow" class="auth-eyebrow">Password reset</p>
      <h1 id="password-heading">Choose a new password</h1>
      <p id="password-description" class="auth-sub">Pick something you haven't used before. You'll be signed out of other devices.</p>

      <!-- Kinde injects the new-password fields and strength rules here -->
      <div id="kinde-widget"></div>

      <div class="auth-foot">
        Remembered it? <a href="https://rota.website/login">Back to sign in</a>
      </div>
    </div>
  </main>

  <script>
    // Kinde also uses this hosted page to verify an existing password during
    // normal sign-in. Only describe it as a reset when it is truly a reset.
    const actionIntent = new URLSearchParams(window.location.search).get("actionIntent");
    if (actionIntent === "verify_password") {
      document.title = "Enter your password · Rota.Website";
      document.getElementById("password-eyebrow").textContent = "Sign in";
      document.getElementById("password-heading").textContent = "Enter your password";
      document.getElementById("password-description").textContent =
        "Enter your existing password to continue signing in.";
    }
  </script>
  <script src="https://cdn.kinde.com/widget/v1/kinde-widget.js"></script>
</body>
</html>
