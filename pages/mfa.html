<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Two-factor authentication · Rota.Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body class="rota-auth-bg">
  <main class="auth-shell">
    <div class="auth-brand">
      <img src="/assets/rota-website-logo.png" alt="Rota.Website" />
    </div>

    <div class="auth-card">
      <p class="auth-eyebrow">Extra security</p>
      <h1>Confirm it's you</h1>
      <p class="auth-sub">Enter the code from your authenticator app or text message.</p>

      <!-- Kinde injects the MFA challenge here -->
      <div id="kinde-widget"></div>
    </div>

    <p class="auth-trust">Lost your device? Ask your manager to reset your access.</p>
  </main>

  <script src="https://cdn.kinde.com/widget/v1/kinde-widget.js"></script>
</body>
</html>
