<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Create your account · Rota.Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body class="rota-auth-bg">
  <main class="auth-shell">
    <div class="auth-brand">
      <img src="/assets/rota-website-logo.png" alt="Rota.Website" />
    </div>

    <div class="auth-card">
      <p class="auth-eyebrow">Create account</p>
      <h1>Set up your login</h1>
      <p class="auth-sub">Choose a password for your Rota.Website account. It takes a few seconds.</p>

      <!-- Kinde injects the registration form here -->
      <div id="kinde-widget"></div>

      <div class="auth-foot">
        Already have an account? <a href="https://rota.website/login">Sign in</a>
      </div>
    </div>

    <p class="auth-trust">Free for up to 5 colleagues · No card needed to start</p>
  </main>

  <script src="https://cdn.kinde.com/widget/v1/kinde-widget.js"></script>
</body>
</html>
